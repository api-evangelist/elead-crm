aid: elead-crm
url: https://raw.githubusercontent.com/api-evangelist/elead-crm/refs/heads/main/apis.yml
name: Elead
kind: company
description: >-
  Elead (eLEAD / Elead CRM) is an automotive dealership CRM for sales, BDC, and
  service, now part of CDK Global. Elead exposes a set of partner-gated Vehicle
  Sales REST APIs - Sales Opportunities, Sales Customers, Sales Activities, and
  Product Reference Data - published through the CDK Fortellis Automotive
  Commerce Exchange. The APIs let certified software providers and dealers
  search and manage prospects/customers, sales opportunities (leads), vehicles
  of interest and trade-ins, sales teams, and activities inside Elead CRM.
  Access is not open self-service - developers must be Fortellis users, create a
  Fortellis solution to obtain client credentials, and have the dealer activate
  the subscription. There is no public WebSocket API.
accessModel:
