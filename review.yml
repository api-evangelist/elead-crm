aid: elead-crm
name: Elead
review:
  question: Does Elead expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Elead's Vehicle Sales APIs (Sales
    Opportunities, Sales Customers, Sales Activities, Product Reference Data)
    are request/response REST over HTTPS, delivered through the CDK Fortellis
    gateway. There is no documented server-push transport (WebSocket or SSE) on
    Elead's own API. CDK's broader CRM catalog references an "Async - receive
    real-time record updates" capability, but that is delivered as
    Fortellis webhook/event subscriptions (server-to-endpoint HTTP callbacks),
    not a WebSocket surface Elead exposes to clients, so there is nothing to
    model as an Elead AsyncAPI document.
findings:
  summary: |
    Elead does not publish a documented public WebSocket API. Elead (eLEAD /
    Elead CRM, now part of CDK Global) offers partner-gated Vehicle Sales REST
    APIs through the CDK Fortellis Automotive Commerce Exchange. The documented
    APIs - Sales Opportunities, Sales Customers, and Product Reference Data
    (plus a Sales Activities API described in CDK product material) - are pure
    request/response REST over HTTPS on the Fortellis gateway
    (https://api.fortellis.io) under the /sales/v1/elead path prefix. Requests
    are authenticated with Fortellis-issued client credentials (client_id +
    client_secret) plus a per-dealer Subscription-Id and a Request-Id
    correlation header. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented on Elead's own API.
  accessModel: |
    Access is partner/certification-gated, not open self-service. To call the
    APIs a developer must be a Fortellis user, create a Fortellis "solution" to
    generate client id and secret, and have the dealership activate/subscribe
    the app to their Elead instance (supplying the Subscription-Id). The APIs
    are marketed to dealers and certified vendor partners; there is no public
    free tier or self-serve signup, and pricing is handled through
    CDK/Fortellis partner agreements (contact sales).
  endpointsConfirmed: |
    The Sales Opportunities, Sales Customers, and Product Reference Data
    operations below are confirmed from CDK Global's Fortellis connector
    reference (mirrored in Microsoft Learn connector docs) and the Fortellis
    API directory. The Sales Activities endpoints are endpointsModeled - CDK
    describes the capability (create/complete activities, appointments, emails,
    activity history) but a public operation-level reference was not located, so
    those paths are inferred and marked as modeled, not fabricated as fact.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.fortellis.io/sales/v1/elead
      documented: true
      note: Vehicle Sales APIs on the CDK Fortellis gateway. Client credentials plus Subscription-Id and Request-Id headers.
    - protocol: Webhook
      scheme: https
      documented: partial
      note: CDK CRM references an "Async / real-time record updates" capability delivered via Fortellis event subscriptions (HTTP callbacks). Not an Elead-hosted WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Elead Vehicle Sales APIs or the Fortellis directory as of the review date.
  endpointsConfirmedRest:
