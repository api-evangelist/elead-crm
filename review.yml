actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Elead's public API is partner-gated
    request/response REST delivered through the CDK Fortellis gateway. No
    AsyncAPI document was created because there is no Elead-hosted server-push
    transport to model; any "real-time" behavior is delivered via Fortellis
    webhook/event subscriptions carried over HTTP, out of scope for an Elead
    AsyncAPI document.
