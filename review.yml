    note: CDK CRM API overview - Sales Bundle (Opportunity, Activities, Customer), Product Reference, Direct Post, and Async capabilities.
  - url: https://www.businesswire.com/news/home/20210209005197/en/CDK-Global-Launches-Advanced-CRM-Data-Capabilities-with-Four-New-Elead-APIs
