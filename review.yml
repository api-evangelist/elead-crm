  endpointsModeled:
    - POST   https://api.fortellis.io/sales/v1/elead/activities
    - GET    https://api.fortellis.io/sales/v1/elead/activities/{activityId}
    - POST   https://api.fortellis.io/sales/v1/elead/activities/{activityId}/complete
    - GET    https://api.fortellis.io/sales/v1/elead/activities/history
  endpointsModeledNote: |
    The activities paths above are inferred from CDK/Elead product descriptions
    ("create scheduled and completed activities, appointments and emails; query
    activity history with comments"). Exact operation names, paths, and
    payloads were not confirmed against a public reference and should be
    verified in the Fortellis directory before implementation.
sources:
  - url: https://learn.microsoft.com/en-us/connectors/cdkeleadsalesopportunities/
    type: Documentation
    note: Full operation-level reference for the Elead Sales Opportunities API (mirror of the Fortellis spec). All REST; no WebSocket.
  - url: https://learn.microsoft.com/en-us/connectors/cdkeleadsalescustomers/
    type: Documentation
    note: Full operation-level reference for the Elead Sales Customers API. Confirms /sales/v1/elead/customers path and Fortellis client credential + Subscription-Id auth.
  - url: https://learn.microsoft.com/en-us/connectors/cdkeleadproductreferencedata/
    type: Documentation
    note: Full operation-level reference for the Elead Product Reference Data API.
  - url: https://apidocs.fortellis.io/
    type: APIReference
    note: Fortellis API directory hosting the Elead Vehicle Sales API specs.
  - url: https://www2.cdkglobal.com/api-solutions-crm
