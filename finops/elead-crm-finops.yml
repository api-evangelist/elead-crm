description: >-
  FinOps view of Elead Vehicle Sales API spend. Elead's APIs are partner-gated
  and delivered through the CDK Fortellis Automotive Commerce Exchange, so cost
  is governed by a CDK/Fortellis partner agreement and per-dealer subscription
  rather than public usage-based pricing. There is no listed per-call rate;
  spend is typically a negotiated program/subscription fee. The primary
  cost-management levers are the number of activated dealer subscriptions, the
  set of APIs enabled per integration, and staying within the gateway
  throttling limits to avoid retries and operational overhead.
notes: >-
  No public per-unit rates were found for the Elead Vehicle Sales APIs. Verify
  partner-program and Fortellis marketplace fees with CDK Global during
  reconciliation. Meters below are structural (what could be metered/allocated),
  not confirmed billed units.
sources:
- https://www.eleadcrm.com
- https://www2.cdkglobal.com/api-solutions-crm
- https://apidocs.fortellis.io/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: CDK Global
serviceCategory: CRM and Sales
billingModel:
  pricingCategory: Contract / Partner Agreement
  billingFrequency: Contract
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: Elead Vehicle Sales APIs
  ServiceCategory: CRM and Sales
  ProviderName: Elead
  PublisherName: CDK Global
  InvoiceIssuerName: CDK Global
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Contract
meters:
- name: dealer_subscriptions
  description: Number of dealership subscriptions activated for a solution (primary allocation unit).
  unit: subscriptions
  aggregation: sum
  dimensions:
  - solution
  - dealer
- name: api_requests
  description: Calls made to the Elead Vehicle Sales APIs; bounded by gateway throttling (100 per 60s per connection).
  unit: requests
  aggregation: sum
  dimensions:
  - solution
  - dealer
  - api
- name: apis_enabled
  description: Which Vehicle Sales APIs (Opportunities, Customers, Activities, Reference Data) are enabled per integration.
  unit: apis
  aggregation: sum
  dimensions:
  - solution
principles:
- name: Visibility
  description: Track API requests and active dealer subscriptions per solution and per API so cost maps to specific dealer integrations.
- name: Allocation
  description: Tag usage by dealer (Subscription-Id) and by API to attribute program cost to the dealership or product line it serves.
- name: Optimization
  description: Enable only the APIs an integration needs, use delta/date-range search and pagination to avoid redundant polling, and stay within gateway throttling limits to avoid 429 retries.
- name: Accountability
  description: Assign an owner per solution/partner agreement and review activated subscriptions and request volume against the negotiated terms.
maintainers:
